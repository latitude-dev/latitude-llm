name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.repository == 'latitude-dev/latitude-llm' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1.0.179
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.

            Focus on:
            - Bugs, correctness issues, and regressions in the diff
            - Security, tenancy, and authorization gaps
            - Architecture or boundary violations against CLAUDE.md / AGENTS.md
            - Missing tests for new behavior

            Skip style nits the linter will catch, pre-existing issues outside the diff, and speculative suggestions.

            How to post the review:
            - Read the PR with `mcp__github__get_pull_request`, `mcp__github__get_pull_request_files`, and `mcp__github__get_pull_request_diff`.
            - For line-specific findings, create a pending review with `mcp__github__create_pending_pull_request_review`, add each finding with `mcp__github__add_comment_to_pending_review`, then submit with `mcp__github__submit_pending_pull_request_review` using event `COMMENT`. Never `APPROVE` or `REQUEST_CHANGES`.
            - The add-comment tool is `mcp__github__add_comment_to_pending_review`. Do not call `add_comment_to_pending_pull_request_review` or `pull_request_review_write`; those names are not available on this server.
            - If GitHub MCP cannot attach a comment to a line, fall back to `mcp__github_inline_comment__create_inline_comment` (pass `confirmed: true`).
            - Use `gh pr comment` only for findings that cannot be attached to a line, or if both inline paths fail. Keep that comment short.
            - If there are no high-confidence issues, do not create or submit a review. If a pending review already exists, delete it with `mcp__github__delete_pending_pull_request_review`.
            - Do not push commits or edit the branch.
            - Only post via these GitHub tools. Do not submit the review as assistant text.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github__get_pull_request,mcp__github__get_pull_request_files,mcp__github__get_pull_request_diff,mcp__github__get_pull_request_reviews,mcp__github__get_pull_request_review_comments,mcp__github__create_pending_pull_request_review,mcp__github__add_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__delete_pending_pull_request_review,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
