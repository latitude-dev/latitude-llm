name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.repository == 'latitude-dev/latitude-llm' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1.0.179
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.

            Focus on:
            - Bugs, correctness issues, and regressions in the diff
            - Security, tenancy, and authorization gaps
            - Architecture or boundary violations against CLAUDE.md / AGENTS.md
            - Missing tests for new behavior

            Skip style nits the linter will catch, pre-existing issues outside the diff, and speculative suggestions.

            How to post the review:
            - Prefer inline comments on specific changed lines via `mcp__github_inline_comment__create_inline_comment` (pass `confirmed: true`).
            - Put each finding on the line it applies to. Do not collect the whole review into one PR comment when inline comments are possible.
            - Use `gh pr comment` only for findings that cannot be attached to a line, or if inline comments fail. Keep that comment short.
            - If there are no high-confidence issues, post nothing.
            - Do not approve, request changes, push commits, or edit the branch.
            - Only post GitHub comments. Do not submit the review as assistant text.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
