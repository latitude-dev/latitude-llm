name: Hermes Telemetry CI

on:
  pull_request:
    branches:
      - development
    paths:
      - packages/telemetry/hermes/**
      # Without this, a PR that only edits this file skips the workflow — which
      # leaves the check pending forever once it is required.
      - .github/workflows/hermes-telemetry-ci.yml
  workflow_call:

concurrency:
  group: hermes-telemetry-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          # The steps below run pull-request-controlled code; nothing here needs git
          # auth after checkout, so do not leave a token in the local git config.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          cd packages/telemetry/hermes
          uv venv
          uv sync --all-extras --all-groups

      - name: Run Ruff linter
        run: |
          cd packages/telemetry/hermes
          uv run ruff check .

      - name: Run Ruff format check
        run: |
          cd packages/telemetry/hermes
          uv run ruff format --check .

      - name: Run tests
        run: |
          cd packages/telemetry/hermes
          uv run pytest tests/ -x
