name: Publish Docker images

on:
  push:
    branches: [development]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-docker-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'latitude-dev/latitude-llm' }}
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingest, workers, workflows, web, migrations]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          image="latitudedata/${{ matrix.service }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
            if ! echo "${version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Release tags must look like vX.Y.Z. Got: ${version}"
              exit 1
            fi
            # Docker image tags drop the leading "v" (git tag v1.2.3 -> image 1.2.3).
            echo "tags=${image}:${version#v},${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:development" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # No VITE_* / DD_* build-args: the public image is env-neutral.
          cache-from: type=gha,scope=public-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=public-${{ matrix.service }}
