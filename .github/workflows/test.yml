name: Tests

on:
  pull_request:
    branches:
      - development
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.test from example
        run: cp .env.example .env.test

      # Build chdb's native binding once, before turbo fans out the test
      # graph. Otherwise the ~2-3 GB native compile races against the heavy
      # test tasks (api/workers/db-clickhouse/web/db-postgres/workflows) and
      # the runner OOM-kills around the 3 minute mark. ensure-chdb-built.mjs
      # is idempotent, so the package-level `chdb:build &&` prefixes become
      # no-ops once the binding exists.
      - name: Build chdb native bindings
        run: pnpm --filter @platform/testkit chdb:build

      - name: Test
        run: pnpm test
