name: Typecheck

on:
  pull_request:
    branches:
      - development
  workflow_call:
    inputs:
      ref:
        description: Git ref to typecheck
        required: false
        type: string

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.test from example
        run: cp .env.example .env.test

      - name: Typecheck
        run: pnpm typecheck
