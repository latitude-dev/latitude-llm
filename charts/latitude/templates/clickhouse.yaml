{{- if .Values.clickhouse.enabled }}
{{/* Mirrors docker/clickhouse/storage.xml: creates the tiered-storage layout. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "latitude.fullname" . }}-clickhouse-config
  labels:
    {{- include "latitude.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  storage.xml: |
    <clickhouse>
      <storage_configuration>
        <disks>
          <default/>
          <cold>
            <path>/var/lib/clickhouse/cold/</path>
          </cold>
        </disks>
        <policies>
          <tiered>
            <volumes>
              <hot>
                <disk>default</disk>
              </hot>
              <cold>
                <disk>cold</disk>
              </cold>
            </volumes>
          </tiered>
        </policies>
      </storage_configuration>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "latitude.fullname" . }}-clickhouse
  labels:
    {{- include "latitude.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  selector:
    {{- include "latitude.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "latitude.fullname" . }}-clickhouse
  labels:
    {{- include "latitude.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: {{ include "latitude.fullname" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "latitude.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        {{- include "latitude.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "latitude.podSettings" . | nindent 6 }}
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          envFrom:
            {{- include "latitude.envFrom" . | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.clickhouse.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/storage.xml
              subPath: storage.xml
      volumes:
        - name: config
          configMap:
            name: {{ include "latitude.fullname" . }}-clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.clickhouse.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
{{- end }}
