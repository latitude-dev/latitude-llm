{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "latitude.fullname" . }}
  labels:
    {{- include "latitude.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ include "latitude.urlHost" .Values.config.webUrl | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "latitude.fullname" . }}-web
                port:
                  name: http
    - host: {{ include "latitude.urlHost" .Values.config.apiUrl | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "latitude.fullname" . }}-api
                port:
                  name: http
    - host: {{ include "latitude.urlHost" .Values.config.ingestUrl | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "latitude.fullname" . }}-ingest
                port:
                  name: http
{{- end }}
