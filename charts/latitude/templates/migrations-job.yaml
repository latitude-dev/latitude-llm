apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "latitude.fullname" . }}-migrations
  labels:
    {{- include "latitude.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "latitude.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      {{- include "latitude.podSettings" . | nindent 6 }}
      containers:
        - name: migrations
          image: {{ include "latitude.image" (dict "root" $ "service" "migrations") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- include "latitude.envFrom" . | nindent 12 }}
          {{- with .Values.config.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
