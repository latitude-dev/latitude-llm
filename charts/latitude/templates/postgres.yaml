{{- if .Values.postgres.enabled }}
{{/* Mirrors docker/init-db.sh: creates the restricted RLS runtime user on first boot. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "latitude.fullname" . }}-postgres-init
  labels:
    {{- include "latitude.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  init-db.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE USER ${POSTGRES_RUNTIME_USER:-latitude_app} WITH PASSWORD '${POSTGRES_RUNTIME_PASSWORD:-secret}';
        GRANT CONNECT ON DATABASE "$POSTGRES_DB" TO ${POSTGRES_RUNTIME_USER:-latitude_app};
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "latitude.fullname" . }}-postgres
  labels:
    {{- include "latitude.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "latitude.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "latitude.fullname" . }}-postgres
  labels:
    {{- include "latitude.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "latitude.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "latitude.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "latitude.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "latitude.podSettings" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "wal_level=logical"]
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            {{- include "latitude.envFrom" . | nindent 12 }}
          env:
            # Subdirectory keeps initdb happy on PVCs that ship a lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: {{ include "latitude.fullname" . }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
