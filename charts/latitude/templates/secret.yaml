{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "latitude.fullname" . }}-secrets
  labels:
    {{- include "latitude.labels" . | nindent 4 }}
type: Opaque
stringData:
  LAT_MASTER_ENCRYPTION_KEY: {{ required "Set secrets.masterEncryptionKey (openssl rand -hex 32)" .Values.secrets.masterEncryptionKey | quote }}
  LAT_BETTER_AUTH_SECRET: {{ required "Set secrets.betterAuthSecret (openssl rand -hex 32)" .Values.secrets.betterAuthSecret | quote }}

  {{- if .Values.postgres.enabled }}
  {{- $password := required "Set postgres.auth.password" .Values.postgres.auth.password }}
  {{- $runtimePassword := required "Set postgres.auth.runtimePassword" .Values.postgres.auth.runtimePassword }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_RUNTIME_PASSWORD: {{ $runtimePassword | quote }}
  {{- $host := printf "%s-postgres" (include "latitude.fullname" .) }}
  LAT_DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgres.auth.runtimeUsername ($runtimePassword | urlquery) $host .Values.postgres.auth.database | quote }}
  LAT_ADMIN_DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgres.auth.username ($password | urlquery) $host .Values.postgres.auth.database | quote }}
  {{- else }}
  LAT_DATABASE_URL: {{ required "Set postgres.external.databaseUrl when postgres.enabled=false" .Values.postgres.external.databaseUrl | quote }}
  LAT_ADMIN_DATABASE_URL: {{ required "Set postgres.external.adminDatabaseUrl when postgres.enabled=false" .Values.postgres.external.adminDatabaseUrl | quote }}
  {{- end }}

  {{- if .Values.clickhouse.enabled }}
  CLICKHOUSE_PASSWORD: {{ required "Set clickhouse.auth.password" .Values.clickhouse.auth.password | quote }}
  LAT_CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.auth.password | quote }}
  {{- else }}
  LAT_CLICKHOUSE_PASSWORD: {{ required "Set clickhouse.external.password when clickhouse.enabled=false" .Values.clickhouse.external.password | quote }}
  {{- end }}

  {{- if and (not .Values.redisBullmq.enabled) .Values.redisBullmq.external.password }}
  LAT_BULLMQ_PASSWORD: {{ .Values.redisBullmq.external.password | quote }}
  {{- end }}

  {{- if .Values.temporal.enabled }}
  TEMPORAL_POSTGRES_PASSWORD: {{ include "latitude.temporalDbPassword" . | quote }}
  {{- else if .Values.temporal.external.apiKey }}
  LAT_TEMPORAL_API_KEY: {{ .Values.temporal.external.apiKey | quote }}
  {{- end }}

  {{- if .Values.seaweedfs.enabled }}
  LAT_STORAGE_S3_ACCESS_KEY_ID: {{ .Values.seaweedfs.s3.accessKeyId | quote }}
  LAT_STORAGE_S3_SECRET_ACCESS_KEY: {{ .Values.seaweedfs.s3.secretAccessKey | quote }}
  {{- else }}
  LAT_STORAGE_S3_ACCESS_KEY_ID: {{ required "Set seaweedfs.external.accessKeyId when seaweedfs.enabled=false" .Values.seaweedfs.external.accessKeyId | quote }}
  LAT_STORAGE_S3_SECRET_ACCESS_KEY: {{ required "Set seaweedfs.external.secretAccessKey when seaweedfs.enabled=false" .Values.seaweedfs.external.secretAccessKey | quote }}
  {{- end }}

  {{- range $name, $value := .Values.secrets.extra }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
