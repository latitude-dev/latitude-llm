api:
  specs:
    - openapi: ../apps/api/openapi.json

# Each language lives in its own group and is generated by a separate
# `fern generate --group <name>` invocation (see the root `generate:sdk`
# script). Do NOT merge them into one group: the CLI runs a group's
# generators concurrently and corrupts the temp config/IR files it hands
# to the Docker containers, failing both generators with JSON parse errors.
groups:
  local-typescript:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 3.64.1
        output:
          # Fern writes generated TypeScript source files here (Client.ts,
          # index.ts, api/, core/, errors/, environments.ts). The surrounding
          # package shell (`package.json`, `tsconfig.json`, `tsdown.config.ts`,
          # `src/index.ts` re-export) is hand-written one level up at
          # `packages/sdk/typescript/`. Fern owns everything inside `src/`;
          # running `pnpm generate:sdk` overwrites the contents.
          location: local-file-system
          path: ../packages/sdk/typescript/src

  local-python:
    generators:
      # Pinned to the newest generator that the CLI pinned in fern.config.json
      # (0.83.0) accepts — 4.33.0+ requires a newer CLI.
      - name: fernapi/fern-python-sdk
        version: 4.32.2
        output:
          # Same arrangement as TypeScript: Fern owns everything inside
          # `src/`; the package shell (`pyproject.toml`, README, CHANGELOG,
          # tests/) is hand-written one level up at `packages/sdk/python/`.
          location: local-file-system
          path: ../packages/sdk/python/src/latitude_sdk
        config:
          client_class_name: LatitudeApiClient
          pydantic_config:
            version: v2
