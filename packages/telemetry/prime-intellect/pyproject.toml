[project]
name = "latitude-telemetry-prime-intellect"
version = "0.1.0"
description = "Export Prime Intellect Verifiers eval rollouts to Latitude as OTLP traces and scores"
authors = [{ name = "Latitude Data SL", email = "hello@latitude.so" }]
maintainers = [{ name = "Latitude Data SL", email = "hello@latitude.so" }]
readme = "README.md"
license = "MIT"
keywords = [
    "prime-intellect",
    "verifiers",
    "telemetry",
    "otlp",
    "opentelemetry",
    "latitude",
    "evals",
]
urls.repository = "https://github.com/latitude-dev/latitude-llm/tree/main/packages/telemetry/prime-intellect"
urls.homepage = "https://github.com/latitude-dev/latitude-llm/tree/main/packages/telemetry/prime-intellect#readme"
urls.documentation = "https://github.com/latitude-dev/latitude-llm/tree/main/packages/telemetry/prime-intellect#readme"
requires-python = ">=3.11, <3.15"
dependencies = [
    "certifi>=2024.2.2",
]

[project.scripts]
latitude-prime-intellect-export = "latitude_telemetry_prime_intellect.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.14.14",
]

[tool.uv]
exclude-newer = "7d"

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "W", "UP"]
ignore = ["F401", "F403", "UP006", "UP035", "UP045", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-p no:warnings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latitude_telemetry_prime_intellect"]
