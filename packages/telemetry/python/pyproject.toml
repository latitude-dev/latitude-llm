[project]
name = "latitude-telemetry"
version = "3.7.0"
description = "Latitude Telemetry for Python"
authors = [{ name = "Latitude Data SL", email = "hello@latitude.so" }]
maintainers = [{ name = "Latitude Data SL", email = "hello@latitude.so" }]
readme = "README.md"
license = "MIT"
urls.repository = "https://github.com/latitude-dev/latitude-llm/tree/main/packages/telemetry/python"
urls.homepage = "https://github.com/latitude-dev/latitude-llm/tree/main/packages/telemetry/python#readme"
urls.documentation = "https://github.com/latitude-dev/latitude-llm/tree/main/packages/telemetry/python#readme"
requires-python = ">=3.11, <3.15"
dependencies = [
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-semantic-conventions-ai==0.5.1",
    "openinference-semantic-conventions==0.1.30",
    "opentelemetry-instrumentation-alephalpha==0.61.0",
    "opentelemetry-instrumentation-anthropic==0.61.0",
    "opentelemetry-instrumentation-bedrock==0.62.1",
    "opentelemetry-instrumentation-cohere==0.62.1",
    "openinference-instrumentation-crewai==1.1.10",
    "openinference-instrumentation-google-adk==0.1.15",
    "openinference-instrumentation-google-genai==1.1.0",
    "opentelemetry-instrumentation-groq==0.61.0",
    "openinference-instrumentation-haystack==0.1.34",
    "opentelemetry-instrumentation-langchain==0.62.1",
    "openinference-instrumentation-llama-index==4.4.2",
    "opentelemetry-instrumentation-mistralai==0.61.0",
    "opentelemetry-instrumentation-ollama==0.61.0",
    "openinference-instrumentation-openai==0.1.52",
    "openinference-instrumentation-openai-agents==1.6.1",
    "opentelemetry-instrumentation-replicate==0.61.0",
    "opentelemetry-instrumentation-sagemaker==0.62.1",
    "opentelemetry-instrumentation-together==0.62.1",
    "opentelemetry-instrumentation-threading==0.65b0",
    "opentelemetry-instrumentation-transformers==0.62.1",
    "opentelemetry-instrumentation-vertexai==0.61.0",
    "opentelemetry-instrumentation-watsonx==0.61.0",
    "pydantic==2.12.5",
    "typing-extensions==4.16.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "pytest==9.1.1",
    "pyright==1.1.411",
    "ruff==0.15.22",
    "sh==2.3.0",
    "openai==2.46.0",
    # Host SDK for the openai-agents integration (example/tests only). The
    # instrumentor (openinference-instrumentation-openai-agents) is the runtime
    # dep; the agents SDK itself is the user's to install.
    "openai-agents==0.15.1",
    # Note: 0.41.0 onwards made Prompt Caching generally available
    # which is not compatible with the instrumentation
    "anthropic==0.117.0",
    "litellm[proxy]==1.88.1",
    # Pinned <2.9.0: openinference-instrumentation-google-genai imports the
    # google.genai._interactions module, which google-genai removed in 2.9.0.
    "google-genai==2.8.0",
]

[tool.uv]
# Refuse to resolve PyPI packages published less than 7 days ago.
# Mirrors `.npmrc minimum-release-age` on the JS side and buys time for
# malicious releases to be yanked before we pick them up (see the May 2026
# Mini Shai-Hulud campaign for why). Relative durations land a rolling cutoff
# — no need to bump a fixed date.
exclude-newer = "7d"

[tool.pyright]
pythonVersion = "3.11"
# Point pyright at the uv-managed venv so editor LSPs (nvim, VS Code) resolve
# imports without needing the user to launch the editor from an activated shell.
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportPrivateUsage = false

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "W", "UP"]
ignore = [
    "F401",
    "F403",
    # Needed because unnecessary str() on field aliases are needed
    # https://docs.pydantic.dev/2.8/concepts/fields/#field-aliases
    "UP018",
    # Needed because typing.List and typing.Dict are semi-deprecated
    # in new Python versions but we want to maintain compatibility
    "UP006",
    "UP035",
    # We maintain a custom StrEnum base class with helper classmethods instead of enum.StrEnum
    "UP042",
    "E402",  # We allow import not at top of file to not import every framework package
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-p no:warnings -n auto"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
