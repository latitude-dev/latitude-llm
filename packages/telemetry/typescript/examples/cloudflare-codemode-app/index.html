<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloudflare Code Mode + Latitude</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font: 15px/1.5 system-ui, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
      }
      main {
        width: 100%;
        max-width: 680px;
        padding: 24px 16px 96px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .sub {
        margin: 0 0 16px;
        opacity: 0.65;
        font-size: 13px;
      }
      .meta {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .meta label {
        flex: 1;
        font-size: 12px;
        opacity: 0.7;
      }
      .meta input {
        width: 100%;
        padding: 6px 8px;
        margin-top: 2px;
        border: 1px solid #8884;
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      #log {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        padding: 10px 12px;
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .user {
        background: #3b82f6;
        color: #fff;
        align-self: flex-end;
        max-width: 85%;
      }
      .assistant {
        background: #8881;
        align-self: flex-start;
        max-width: 85%;
      }
      .status {
        font-size: 12px;
        opacity: 0.6;
        align-self: flex-start;
      }
      .error {
        color: #ef4444;
      }
      form {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        background: Canvas;
        border-top: 1px solid #8883;
        justify-content: center;
      }
      form > div {
        display: flex;
        gap: 8px;
        width: 100%;
        max-width: 680px;
      }
      #input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #8884;
        border-radius: 8px;
        background: transparent;
        color: inherit;
      }
      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #3b82f6;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
